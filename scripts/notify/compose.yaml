name: aopc-notify
services:
  inbox:
    build: .
    image: aopc-notify:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:17654:17654"
    volumes:
      - messages:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:17654/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  messages:
