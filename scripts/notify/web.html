<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · AOPC Notify</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #24352f; background: #f4f6f3; }
    * { box-sizing: border-box; } body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid #dfe6df; }
    nav { max-width: 840px; margin: auto; padding: 22px 24px; display: flex; align-items: center; gap: 12px; }
    .brand { font-size: 17px; font-weight: 700; letter-spacing: -.4px; color: #153e2d; text-decoration: none; }
    .brand span { background: #e7efe8; border-radius: 7px; padding: 6px 9px; margin-right: 8px; }
    .nav-link { margin-left: auto; font-size: 13px; }
    a { color: #2e6b4c; text-underline-offset: 3px; }
    main { max-width: 840px; margin: auto; padding: 42px 24px 64px; }
    .intro { margin-bottom: 30px; } .intro > a { font-size: 13px; }
    h1 { margin: 18px 0 10px; font-size: 28px; font-weight: 600; letter-spacing: -.8px; }
    .intro p, .meta { color: #728078; font-size: 13px; line-height: 1.7; }
    .card, .detail, .empty { display: block; background: #fff; border: 1px solid #dfe6df; border-radius: 12px; padding: 24px; margin-bottom: 14px; }
    .card { color: inherit; text-decoration: none; transition: border-color .15s; }
    .card:hover { border-color: #739a7c; } .card:focus-visible { outline: 3px solid #739a7c; outline-offset: 3px; }
    .card p { margin: 14px 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
    .more { font-size: 12px; color: #2e6b4c; }
    .detail { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.9; }
    .empty { padding: 60px 24px; text-align: center; color: #728078; }
    footer { font-size: 12px; color: #829087; margin-top: 32px; }
    @media (max-width: 500px) { main { padding: 24px 16px; } nav { padding: 18px 16px; } .card, .detail { padding: 20px; } }
  </style>
</head>
<body>
  <header><nav><a class="brand" href="/"><span>A</span>AOPC Notify</a><a class="nav-link" href="/">收件箱 / 刷新</a></nav></header>
  <main>$content<footer>只接收消息，随时回来查看。</footer></main>
</body>
</html>
